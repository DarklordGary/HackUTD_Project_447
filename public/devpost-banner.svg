<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ping — your financial multiverse</title>
  <desc id="desc">A bright, branching financial timeline with Ping the bird exploring possible futures.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f8eb"/><stop offset="1" stop-color="#e8f4db"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d9f6a3"/><stop offset="1" stop-color="#b6ed69"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#398657" opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#163c32" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#dots)"/>
  <circle cx="1300" cy="100" r="220" fill="#d9f6a3" opacity=".32"/>
  <circle cx="90" cy="900" r="260" fill="#b6ed69" opacity=".18"/>

  <!-- branching futures -->
  <g fill="none" stroke-linecap="round">
    <path d="M130 510 C390 510 408 510 560 510 C725 510 724 620 900 620 C1074 620 1090 493 1360 493" stroke="#398657" stroke-width="8" opacity=".6"/>
    <path d="M560 510 C735 510 745 850 930 850 C1100 850 1130 755 1370 755" stroke="#f4b45c" stroke-width="7" opacity=".75"/>
    <path d="M560 510 C730 510 762 390 934 390 C1100 390 1110 275 1370 275" stroke="#74b7a0" stroke-width="7" opacity=".82"/>
    <path d="M131 510 H560" stroke="#398657" stroke-width="8"/>
  </g>
  <g fill="#f7f8eb" stroke-width="7">
    <circle cx="560" cy="510" r="17" stroke="#398657"/><circle cx="900" cy="620" r="17" stroke="#398657"/>
    <circle cx="934" cy="390" r="17" stroke="#74b7a0"/><circle cx="930" cy="850" r="17" stroke="#f4b45c"/>
    <circle cx="1360" cy="493" r="17" stroke="#398657"/><circle cx="1370" cy="275" r="17" stroke="#74b7a0"/><circle cx="1370" cy="755" r="17" stroke="#f4b45c"/>
  </g>

  <!-- central mark -->
  <g filter="url(#shadow)"><circle cx="760" cy="510" r="230" fill="url(#hero)" stroke="#fffdf3" stroke-width="14"/></g>
  <g transform="translate(635 385) scale(3.9)">
    <rect width="64" height="64" rx="20" fill="#d9f6a3"/>
    <path d="M16 51V26C16 10 42 6 46 24l-5 23-12-5-7 12Z" fill="#398657"/>
    <path d="M31 18c12-7 22 2 20 13L37 34Z" fill="#b6ed69"/>
    <path d="m48 25 12 7-13 6Z" fill="#f4b45c"/>
    <circle cx="43" cy="23" r="3" fill="#163c32"/>
    <path d="M24 31c14-3 16 14 3 17" fill="#226547"/>
  </g>

</svg>
